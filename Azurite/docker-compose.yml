services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: azurite_storage
    hostname: azurite
    ports:
      - "10000:10000" # Blob service
      - "10001:10001" # Queue service
      - "10002:10002" # Table service
    volumes:
      - ./azurite_data:/data
    command: azurite-blob --blobHost 0.0.0.0 --location /data --debug /data/debug.log --skipApiVersionCheck